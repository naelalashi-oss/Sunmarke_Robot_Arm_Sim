<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Lab Robot Arm Sim v1.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0f172a; font-family: 'Inter', sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        #ui-panel { position: absolute; top: 0; right: 0; width: 400px; height: 100vh; z-index: 10; background-color: rgba(15, 23, 42, 0.95); border-left: 1px solid #334155; overflow-y: auto; box-shadow: -4px 0 25px rgba(0,0,0,0.7); backdrop-filter: blur(12px); display: flex; flex-direction: column; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        
        .slider-container { margin-bottom: 0.75rem; }
        input[type=range] { width: 100%; cursor: pointer; accent-color: #3b82f6; }
        .input-num { background: #1e293b; border: 1px solid #475569; color: white; padding: 4px 8px; border-radius: 4px; width: 70px; outline: none; transition: border 0.2s; }
        .input-num:focus { border-color: #3b82f6; }
        
        .btn { transition: all 0.2s ease-in-out; }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: scale(1); }

        .tab-btn { border-bottom: 2px solid transparent; transition: all 0.2s; }
        .tab-btn.active { border-bottom-color: #a855f7; color: #a855f7; font-weight: bold; background: rgba(168, 85, 247, 0.1); }
    </style>
</head>

        <!-- BIGGER Achievement Bar -->
        <div class="px-5 py-4 border-b border-slate-700 bg-slate-900/50">
            <div class="flex justify-between items-center mb-2">
                <span class="text-sm font-bold text-slate-300 uppercase tracking-wider">Achievements</span>
                <span id="achievement-text" class="text-sm font-black text-emerald-400">0 / 8</span>
            </div>
            <div class="w-full bg-slate-800 rounded-full h-3 shadow-inner border border-slate-700">
                <div id="achievement-bar" class="bg-gradient-to-r from-emerald-500 to-teal-400 h-3 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="flex border-b border-slate-700 bg-slate-900/50">
            <button id="tab-testmode" class="tab-btn active flex-1 py-3 text-sm text-slate-400 hover:text-slate-200 uppercase tracking-wider">Test Mode</button>
            <button id="tab-challenges" class="tab-btn flex-1 py-3 text-sm text-slate-400 hover:text-slate-200 uppercase tracking-wider">Challenges</button>
        </div>

        <div class="p-5 flex-1 overflow-y-auto flex flex-col gap-5 text-sm">
            
            <!-- FK Global Panel -->
            <div class="bg-slate-800/50 rounded-xl p-4 border border-slate-700 shadow-inner">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-sm font-bold text-blue-400 uppercase tracking-wider">Forward Kinematics</h2>
                    <span class="text-[10px] bg-blue-500/20 text-blue-300 px-2 py-1 rounded">Angles</span>
                </div>
                <div id="fk-sliders" class="space-y-1">
                    <!-- Sliders generated dynamically via JavaScript -->
                </div>
                <button id="reset-btn" class="btn mt-4 w-full bg-slate-700 hover:bg-slate-600 text-white py-2 rounded-lg font-semibold shadow-md">
                    Reset to Home Position
                </button>
            </div>

            <!-- Test Mode Panel -->
            <div id="panel-testmode" class="block">
                <div class="bg-slate-800/50 rounded-xl p-4 border border-slate-700 shadow-inner">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-sm font-bold text-emerald-400 uppercase tracking-wider">Inverse Kinematics</h2>
                        <span class="text-[10px] bg-emerald-500/20 text-emerald-300 px-2 py-1 rounded">Target</span>
                    </div>
                    
                    <div class="flex items-center gap-3 mb-4 bg-slate-900 p-3 rounded-lg border border-slate-700">
                        <div class="flex flex-col gap-1 items-center">
                            <label class="text-xs font-bold text-red-400">X</label>
                            <input type="number" id="ik-x" class="input-num text-center font-mono" value="5" step="0.5">
                        </div>
                        <div class="flex flex-col gap-1 items-center">
                            <label class="text-xs font-bold text-green-400">Y</label>
                            <input type="number" id="ik-y" class="input-num text-center font-mono" value="5" step="0.5">
                        </div>
                        <div class="flex flex-col gap-1 items-center">
                            <label class="text-xs font-bold text-blue-400">Z</label>
                            <input type="number" id="ik-z" class="input-num text-center font-mono" value="0" step="0.5">
                        </div>
                    </div>
                    
                    <button id="solve-ik-btn" class="btn w-full bg-gradient-to-r from-emerald-600 to-teal-500 hover:from-emerald-500 hover:to-teal-400 text-white py-2.5 rounded-lg font-bold shadow-lg shadow-emerald-500/20">
                        Solve IK (CCD Damped)
                    </button>

                    <!-- IK Warning Notification -->
                    <div id="ik-warning" class="hidden mt-3 text-center py-2 px-3 rounded-lg font-bold text-xs bg-red-900/80 border border-red-700 text-red-200 shadow-inner">
                        ⚠️ Warning: Target is unreachable or blocked!
                    </div>
                </div>
            </div>

            <!-- Challenges Panel -->
            <div id="panel-challenges" class="hidden">
                <div class="bg-slate-800/50 rounded-xl p-4 border border-slate-700 shadow-inner">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-sm font-bold text-purple-400 uppercase tracking-wider">Active Challenge</h2>
                        <span class="text-[10px] bg-purple-500/20 text-purple-300 px-2 py-1 rounded">Test</span>
                    </div>
                    
                    <select id="challenge-select" class="w-full bg-slate-900 text-slate-200 border border-slate-600 rounded-lg p-2.5 mb-3 outline-none focus:border-purple-500 font-medium text-sm">
                        <!-- Dynamically populated -->
                    </select>
                    
                    <div class="flex justify-between items-center mb-2 px-1">
                        <span id="challenge-step-counter" class="text-xs font-bold text-indigo-400">Step 1 of X</span>
                    </div>

                    <div class="bg-slate-900/80 p-3 rounded-lg border border-slate-700 mb-4 min-h-[60px] flex items-center">
                        <p id="challenge-desc" class="text-xs text-slate-300 leading-relaxed"></p>
                    </div>
                    
                    <div id="ik-disabled-badge" class="mb-3 text-center py-1.5 px-2 rounded font-bold text-[10px] bg-orange-900/80 border border-orange-700 text-orange-200 uppercase tracking-wider">
                        ⚠ IK Disabled: Use FK Sliders manually
                    </div>

                    <!-- Sequence Controls (For Ch 6,7,8) -->
                    <div id="sequence-panel" class="hidden mb-3">
                        <div class="flex justify-between items-center mb-2 px-1">
                            <span class="text-[10px] font-bold text-sky-400 uppercase tracking-wider">Waypoint Sequence</span>
                            <button id="clear-poses-btn" class="text-[10px] bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded text-white shadow transition-all">Clear All</button>
                        </div>
                        <div id="pose-list" class="bg-slate-900 border border-slate-700 rounded p-2 mb-2 min-h-[44px] max-h-[100px] overflow-y-auto text-xs text-slate-400 space-y-1 shadow-inner">
                            <div class="text-slate-500 italic text-center py-1">No poses saved yet.</div>
                        </div>
                        <div class="flex gap-2">
                            <button id="save-pose-btn" class="btn flex-1 bg-sky-700 hover:bg-sky-600 text-white py-2 rounded font-bold shadow-md shadow-sky-900/20 text-xs">

        function buildRobotArm() {
            const baseGeo = new THREE.CylinderGeometry(2, 2.2, 0.5, 32);
            const baseMat = new THREE.MeshStandardMaterial({ color: 0x4b5563, roughness: 0.7, metalness: 0.2 });
            const base = new THREE.Mesh(baseGeo, baseMat);
            base.position.y = 0.25;
            base.castShadow = true;
            base.receiveShadow = true;
            scene.add(base);

            let currentParent = base;
            let currentHeight = 0.25;

            robotConfig.forEach((cfg, index) => {
                const jointGroup = new THREE.Group();
                jointGroup.position.y = currentHeight;
                currentParent.add(jointGroup);
                joints.push(jointGroup);

                const jointVisGeo = new THREE.CylinderGeometry(0.8, 0.8, 1.2, 32);
                if(cfg.axis === 'x') jointVisGeo.rotateZ(Math.PI/2);
                if(cfg.axis === 'z') jointVisGeo.rotateX(Math.PI/2);
                const jointVisMat = new THREE.MeshStandardMaterial({ color: 0xd1d5db, roughness: 0.5, metalness: 0.1 });
                const jointVis = new THREE.Mesh(jointVisGeo, jointVisMat);
                jointVis.castShadow = true;
                jointGroup.add(jointVis);

                const linkGeo = new THREE.CylinderGeometry(0.5, 0.6, cfg.length, 16);
                linkGeo.translate(0, cfg.length / 2, 0); 
                const linkMat = new THREE.MeshStandardMaterial({ color: cfg.color, roughness: 0.6, metalness: 0.1 });
                const link = new THREE.Mesh(linkGeo, linkMat);
                link.castShadow = true;
                link.receiveShadow = true;
                jointGroup.add(link);

                currentParent = jointGroup;
                currentHeight = cfg.length;
            });

            const eeGeo = new THREE.SphereGeometry(0.5, 32, 32);
            const eeMat = new THREE.MeshStandardMaterial({ color: 0xff0000, roughness: 0.4, metalness: 0.1 });
            endEffector = new THREE.Mesh(eeGeo, eeMat);
            endEffector.position.y = currentHeight;
            currentParent.add(endEffector);
        }

        function checkCollision() {
            scene.updateMatrixWorld(true);
            
            for (let k = 2; k < joints.length; k++) {
                let checkPos = new THREE.Vector3();
                joints[k].getWorldPosition(checkPos);
                if (checkPos.y < 0.02) return true;
            }
            let eeCheck = new THREE.Vector3();
            endEffector.getWorldPosition(eeCheck);
            if (eeCheck.y < 0.02) return true;

            if (currentTab === 'challenges' && activeObstacleBoxes.length > 0) {
                // Expanding the bounding box by the physical radius of the arm links (0.45) 
                // to prevent clipping on thin objects like the Ceiling Plate.
                for(let i = 0; i < joints.length - 1; i++) {
                    let p1 = new THREE.Vector3();
                    let p2 = new THREE.Vector3();
                    joints[i].getWorldPosition(p1);
                    joints[i+1].getWorldPosition(p2);
                    
                    const dist = p1.distanceTo(p2);
                    const segments = Math.max(10, Math.ceil(dist * 5)); 
                    
                    for(let j = 0; j <= segments; j++) {
                        let pt = p1.clone().lerp(p2, j/segments);
                        for(let box of activeObstacleBoxes) {
                            let collisionBox = box.clone().expandByScalar(0.45); 
                            if(collisionBox.containsPoint(pt)) return true;
                        }
                    }
                }
                
                let pFinal = new THREE.Vector3();
                joints[joints.length - 1].getWorldPosition(pFinal);
                const distFinal = pFinal.distanceTo(eeCheck);
                const segmentsFinal = Math.max(5, Math.ceil(distFinal * 5));
                
                for(let j = 0; j <= segmentsFinal; j++) {
                    let pt = pFinal.clone().lerp(eeCheck, j/segmentsFinal);
                    for(let box of activeObstacleBoxes) {
                        let collisionBox = box.clone().expandByScalar(0.45);
                        if(collisionBox.containsPoint(pt)) return true;
                    }
                }
            }

            return false;
        }

        function buildFKUI() {
            const fkContainer = document.getElementById('fk-sliders');
            
            robotConfig.forEach((cfg, i) => {

                const header = document.createElement('div');
                header.className = 'flex justify-between items-center mb-1';
                
                const label = document.createElement('label');
                label.innerText = cfg.name;
                label.className = 'text-slate-300 font-medium text-xs';
                
                const valueDisp = document.createElement('span');
                valueDisp.id = `val-j${i}`;
                valueDisp.innerText = '0°';
                valueDisp.className = 'text-blue-400 font-mono text-xs font-bold w-10 text-right';
                
                header.appendChild(label);
                header.appendChild(valueDisp);
                
                const slider = document.createElement('input');
                slider.type = 'range';
                slider.min = cfg.min;
                slider.max = cfg.max;
                slider.value = '0';
                slider.id = `slider-j${i}`;
                
                slider.addEventListener('input', (e) => {
                    const deg = parseFloat(e.target.value);
                    const rad = deg * (Math.PI / 180);
                    const prevRad = joints[i].rotation[cfg.axis];
                    
                    joints[i].rotation.set(0, 0, 0); 
                    joints[i].rotation[cfg.axis] = rad;
                    
                    if (i < 4 && checkCollision()) {
                        joints[i].rotation[cfg.axis] = prevRad;
                        scene.updateMatrixWorld(true);
                        const prevDeg = Math.round(prevRad * (180 / Math.PI));
                        slider.value = prevDeg;
                        valueDisp.innerText = `${prevDeg}°`;
                    } else {
                        valueDisp.innerText = `${deg}°`;
                    }
                });

                slider.addEventListener('change', () => {
                    if (currentTab === 'challenges' && currentChallenge.sequenceMode) {
                        const newWaypoint = joints.map((j, idx) => j.rotation[robotConfig[idx].axis]);
                        currentAdjustmentPath.push(newWaypoint);

                wrapper.appendChild(header);
                wrapper.appendChild(slider);

            for(let i=0; i<6; i++) {

        function setupSandboxTarget() {
            const targetGeo = new THREE.SphereGeometry(0.5, 16, 16);

            sandboxTargetMarker = new THREE.Mesh(targetGeo, targetMat);

        function updateSandboxMarkerPosition() {
            const x = parseFloat(document.getElementById('ik-x').value) || 0;
            const y = parseFloat(document.getElementById('ik-y').value) || 0;
            const z = parseFloat(document.getElementById('ik-z').value) || 0;

            const warningEl = document.getElementById('ik-warning');

        function solveIK(targetPos) {
            const maxIterations = 100;
            const distanceThreshold = 0.05; 
            const maxStepRadius = 0.5; 
            const dampingFactor = 0.5; 
            
            for (let iter = 0; iter < maxIterations; iter++) {
                scene.updateMatrixWorld(true);
                let eePos = new THREE.Vector3();
                endEffector.getWorldPosition(eePos);
                
                if (eePos.distanceTo(targetPos) < distanceThreshold) break;

                for (let i = joints.length - 1; i >= 0; i--) {
                    if (i === 5) continue; 

                    const joint = joints[i];
                    const axisName = robotConfig[i].axis;

                    scene.updateMatrixWorld(true);

                    let jPos = new THREE.Vector3();
                    joint.getWorldPosition(jPos);
                    endEffector.getWorldPosition(eePos);

                    let localAxis = new THREE.Vector3();
                    localAxis[axisName] = 1; 
                    let axisWorld = localAxis.clone().transformDirection(joint.matrixWorld).normalize();

                    let jToEe = eePos.clone().sub(jPos);
                    let jToTarget = targetPos.clone().sub(jPos);

                    if (jToEe.lengthSq() < 0.0001 || jToTarget.lengthSq() < 0.0001) continue;

                    jToEe.projectOnPlane(axisWorld);
                    jToTarget.projectOnPlane(axisWorld);
                    
                    if (jToEe.lengthSq() < 0.00001 || jToTarget.lengthSq() < 0.00001) continue;

                    jToEe.normalize();
                    jToTarget.normalize();

                    let dotProd = THREE.MathUtils.clamp(jToEe.dot(jToTarget), -1.0, 1.0);
                    let angle = Math.acos(dotProd);

                    if (angle > 0.001 && !isNaN(angle)) {
                        let cross = jToEe.clone().cross(jToTarget);
                        if (cross.dot(axisWorld) < 0) angle = -angle;

                        let step = THREE.MathUtils.clamp(angle, -maxStepRadius, maxStepRadius) * dampingFactor;
                        let oldAngle = joint.rotation[axisName];
                        
                        let newAngle = oldAngle + step;
                        const minRad = robotConfig[i].min * (Math.PI / 180);
                        const maxRad = robotConfig[i].max * (Math.PI / 180);
                        
                        if (robotConfig[i].min <= -180 && robotConfig[i].max >= 180) {
                            newAngle = Math.atan2(Math.sin(newAngle), Math.cos(newAngle));
                        } else {
                            newAngle = THREE.MathUtils.clamp(newAngle, minRad, maxRad);
                        }

                        if (Math.abs(newAngle - oldAngle) > 0.0001) {
                            joint.rotation[axisName] = newAngle;

                            if (checkCollision()) {
                                joint.rotation[axisName] = oldAngle; 
                                scene.updateMatrixWorld(true);
                            }
                        }
                    }
                }
            }
            updateFKUIFromJoints();
            
            if (currentTab === 'testmode') {
                scene.updateMatrixWorld(true);
                let finalEePos = new THREE.Vector3();
                endEffector.getWorldPosition(finalEePos);
                const finalDist = finalEePos.distanceTo(targetPos);
                
                const warningEl = document.getElementById('ik-warning');
                if (warningEl) {
                    if (finalDist > 0.2) {
                        warningEl.classList.remove('hidden');
                    } else {
                        warningEl.classList.add('hidden');
                    }
                }
            }
        }

        // --- SEQUENCE MODE LOGIC ---
        
        function clearPoses() {
            recordedPoses = [];
            currentAdjustmentPath = [];
            renderPoseList();
            document.getElementById('challenge-status').classList.add('hidden');
        }

        function savePose() {
            const finalPose = joints.map((j, i) => j.rotation[robotConfig[i].axis]);
            currentAdjustmentPath.push(finalPose);

            let cleanPath = [];
            for(let i = 0; i < currentAdjustmentPath.length; i++) {
                if(i === 0 || JSON.stringify(currentAdjustmentPath[i]) !== JSON.stringify(cleanPath[cleanPath.length - 1])) {
                    cleanPath.push(currentAdjustmentPath[i]);
                }
            }

            recordedPoses.push({
                path: cleanPath
            });
            
            renderPoseList();
            currentAdjustmentPath = [];
        }

        window.deletePose = function(index) {
            recordedPoses.splice(index, 1);
            renderPoseList();
        }

        function renderPoseList() {
            const list = document.getElementById('pose-list');
            if (recordedPoses.length === 0) {
                list.innerHTML = '<div class="text-slate-500 italic text-center py-1">No poses saved yet.</div>';
                return;
            }

            list.innerHTML = '';
            recordedPoses.forEach((pose, idx) => {
                const item = document.createElement('div');
                item.className = 'px-2 py-1.5 bg-slate-800 rounded flex justify-between items-center border border-slate-700 shadow-sm';
                item.innerHTML = `
                    <span class="text-sky-400 font-bold">Pose Block ${idx + 1}</span> 
                    <div class="flex items-center gap-2">
                        <span class="text-slate-500 font-mono text-[10px] uppercase">${pose.path.length} Waypoints</span>
                        <button onclick="deletePose(${idx})" class="text-red-400 hover:text-red-300 font-bold px-1.5 py-0.5 bg-red-950/50 rounded border border-red-800/50 transition-all text-xs" title="Delete Pose">✕</button>
                    </div>
                `;
                list.appendChild(item);
            });
            list.scrollTop = list.scrollHeight;
        }

        async function animateToPose(targetAngles, duration = 800) {
            const startAngles = joints.map((j, i) => j.rotation[robotConfig[i].axis]);
            const startTime = performance.now();
            return new Promise(resolve => {
                function step(time) {
                    const elapsed = time - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const ease = progress < 0.5 ? 2 * progress * progress : -1 + (4 - 2 * progress) * progress;
                    
                    for(let i=0; i<6; i++) {
                        joints[i].rotation[robotConfig[i].axis] = startAngles[i] + (targetAngles[i] - startAngles[i]) * ease;
                    }
                    scene.updateMatrixWorld(true);
                    updateFKUIFromJoints();
                    
                    if (checkCollision()) { 
                        for(let i=0; i<6; i++) joints[i].rotation[robotConfig[i].axis] = startAngles[i];
                        scene.updateMatrixWorld(true);
                        updateFKUIFromJoints();
                        resolve(false);
                        return;
                    }

                    if (progress < 1) requestAnimationFrame(step);
                    else resolve(true); 
                }
                requestAnimationFrame(step);
            });
        }

        async function playSequence() {
            if (recordedPoses.length === 0) return;
            
            const statusEl = document.getElementById('challenge-status');
            statusEl.classList.remove('hidden', 'bg-emerald-600', 'bg-red-600', 'bg-blue-600', 'text-white', 'text-red-200', 'bg-sky-600');
            statusEl.innerHTML = "⏳ Resetting to home & playing...";
            statusEl.className = "text-center py-2.5 px-3 rounded-lg font-bold text-sm shadow-inner transition-all duration-300 bg-sky-600 text-white mt-2 block";
            
            document.getElementById('save-pose-btn').disabled = true;
            document.getElementById('play-sequence-btn').disabled = true;
            document.getElementById('clear-poses-btn').disabled = true;
            document.getElementById('challenge-select').disabled = true;
            
            for(let i = 0; i < 6; i++) {
                joints[i].rotation.set(0, 0, 0);
            }
            scene.updateMatrixWorld(true);
            updateFKUIFromJoints();

            currentStepIndex = 0;
            updateChallengeUI();

            let sequenceSuccess = false;
            let failed = false;
            
            for (let pIdx = 0; pIdx < recordedPoses.length; pIdx++) {
                const poseBlock = recordedPoses[pIdx];
                
                for(let wIdx = 0; wIdx < poseBlock.path.length; wIdx++) {
                    const waypoint = poseBlock.path[wIdx];
                    const moveSuccess = await animateToPose(waypoint, 600); 
                    
                    if (!moveSuccess) { 
                        statusEl.innerHTML = `❌ FAILED: Collision during Pose Block ${pIdx + 1} (Waypoint ${wIdx + 1})!`;
                        statusEl.className = "text-center py-2.5 px-3 rounded-lg font-bold text-sm shadow-inner transition-all duration-300 bg-red-900/80 border border-red-700 text-red-200 mt-2 block";
                        failed = true;
                        break;
                    }
                }
                
                if (failed) break;
                
                while (currentStepIndex < currentChallenge.steps.length) {
                    let stepPassed = false;
                    const currentStep = currentChallenge.steps[currentStepIndex];
                    
                    if (currentStep.type === 'ik' || currentStep.type === 'combined') {
                        scene.updateMatrixWorld(true);
                        let eePos = new THREE.Vector3();
                        endEffector.getWorldPosition(eePos);
                        if (eePos.distanceTo(currentStep.targets.position) <= 0.8) stepPassed = true;
                    }
                    
                    if (stepPassed) {
                        currentStepIndex++;
                        updateChallengeUI();
                        if (currentStepIndex >= currentChallenge.steps.length) {
                            sequenceSuccess = true;
                            break;
                        }
                    } else {
                        break; 
                    }
                }
                
                if (sequenceSuccess) break;

                await new Promise(r => setTimeout(r, 1500));
            }
            
            if (!failed) {
                if (sequenceSuccess) {
                    completeCurrentChallenge();

                    statusEl.innerHTML = "✨ SUCCESS! Challenge Complete.";
                    statusEl.className = "text-center py-2.5 px-3 rounded-lg font-bold text-sm shadow-inner transition-all duration-300 bg-emerald-600 text-white mt-2 block";
                } else {
                    statusEl.innerHTML = `❌ FAILED: Sequence ended before completing all targets.`;
                    statusEl.className = "text-center py-2.5 px-3 rounded-lg font-bold text-sm shadow-inner transition-all duration-300 bg-red-900/80 border border-red-700 text-red-200 mt-2 block";
                }
            }
            
            document.getElementById('save-pose-btn').disabled = false;
            document.getElementById('play-sequence-btn').disabled = false;
            document.getElementById('clear-poses-btn').disabled = false;
            document.getElementById('challenge-select').disabled = false;
        }

        // --- END SEQUENCE LOGIC ---

        function setupChallenges() {
            const selectEl = document.getElementById('challenge-select');
            selectEl.innerHTML = '';
            challenges.forEach((ch, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                opt.innerText = ch.title;
                selectEl.appendChild(opt);
            });

            selectEl.addEventListener('change', (e) => loadChallenge(parseInt(e.target.value)));
            
            document.getElementById('check-challenge-btn').addEventListener('click', checkChallengeStep);
            document.getElementById('save-pose-btn').addEventListener('click', savePose);
            document.getElementById('clear-poses-btn').addEventListener('click', clearPoses);
            document.getElementById('play-sequence-btn').addEventListener('click', playSequence);
            
            loadChallenge(0);
        }

        function loadChallenge(index) {
            currentChallenge = challenges[index];
            currentStepIndex = 0;
            
            for(let i = 0; i < 6; i++) {
                joints[i].rotation.set(0, 0, 0);
            }
            scene.updateMatrixWorld(true);
            updateFKUIFromJoints();
            
            clearPoses(); 
            
            while(challengeMarkersGroup.children.length > 0) challengeMarkersGroup.remove(challengeMarkersGroup.children[0]); 
            while(challengeObstaclesGroup.children.length > 0) challengeObstaclesGroup.remove(challengeObstaclesGroup.children[0]);
            activeObstacleBoxes = [];

            currentChallenge.steps.forEach((step, idx) => {
                if (step.targets.position) {
                    const chGeo = new THREE.SphereGeometry(0.5, 16, 16);
                    const chMat = new THREE.MeshBasicMaterial({ color: step.color || 0xfacc15, wireframe: true, transparent: true, opacity: 0.2 });
                    const marker = new THREE.Mesh(chGeo, chMat);
                    marker.position.copy(step.targets.position);
                    marker.userData = { stepIndex: idx };
                    challengeMarkersGroup.add(marker);
                }
            });

            if (currentChallenge.obstacles) {
                currentChallenge.obstacles.forEach(obs => {
                    const obsGeo = new THREE.BoxGeometry(obs.size[0], obs.size[1], obs.size[2]);
                    const obsMat = new THREE.MeshStandardMaterial({ 
                        color: obs.color, 
                        transparent: true, 
                        opacity: 0.8,
                        roughness: 0.2 
                    });
                    const mesh = new THREE.Mesh(obsGeo, obsMat);
                    mesh.position.set(obs.position[0], obs.position[1], obs.position[2]);
                    mesh.castShadow = true;
                    mesh.receiveShadow = true;
                    challengeObstaclesGroup.add(mesh);

                    scene.updateMatrixWorld(true);
                    const box = new THREE.Box3().setFromObject(mesh);
                    activeObstacleBoxes.push(box);
                });
            }

            updateChallengeUI();
            document.getElementById('challenge-status').classList.add('hidden');
        }

        function updateChallengeUI() {
            const step = currentChallenge.steps[currentStepIndex] || currentChallenge.steps[currentChallenge.steps.length - 1];
            document.getElementById('challenge-desc').innerText = step.description;
            document.getElementById('challenge-step-counter').innerText = `Step ${Math.min(currentStepIndex + 1, currentChallenge.steps.length)} of ${currentChallenge.steps.length}`;
            
            const seqPanel = document.getElementById('sequence-panel');
            const evalBtn = document.getElementById('check-challenge-btn');
            
            if (currentChallenge.sequenceMode) {
                seqPanel.classList.remove('hidden');
                evalBtn.classList.add('hidden');
            } else {
                seqPanel.classList.add('hidden');
                evalBtn.classList.remove('hidden');
            }

            challengeMarkersGroup.children.forEach(marker => {
                if (marker.userData.stepIndex === currentStepIndex) {
                    marker.material.opacity = 0.9;
                    marker.material.wireframe = false;
                    marker.visible = true;
                } else if (marker.userData.stepIndex < currentStepIndex) {
                    marker.visible = false;
                } else {
                    marker.material.opacity = 0.25;
                    marker.material.wireframe = true;
                    marker.visible = true;
                }
            });
        }

        function checkChallengeStep() {
            const statusEl = document.getElementById('challenge-status');
            statusEl.classList.remove('hidden', 'bg-emerald-600', 'bg-red-600', 'bg-blue-600', 'text-white', 'text-red-200');
            
            let isSuccess = true;
            let failReason = "";
            const currentStep = currentChallenge.steps[currentStepIndex];

            if (currentStep.type === 'fk' || currentStep.type === 'combined') {
                for(let i = 0; i < 6; i++) {
                    const targetAngle = currentStep.targets.joints[i];
                    if (targetAngle !== null && targetAngle !== undefined) {
                        let currentRad = joints[i].rotation[robotConfig[i].axis];
                        currentRad = Math.atan2(Math.sin(currentRad), Math.cos(currentRad));
                        const currentDeg = currentRad * (180 / Math.PI);
                        if (Math.abs(currentDeg - targetAngle) > 3.0) {
                            isSuccess = false;
                            failReason = `Joint ${i+1} is at ${Math.round(currentDeg)}°, target is ${targetAngle}°.`;
                            break;
                        }
                    }
                }
            }

            if (isSuccess && (currentStep.type === 'ik' || currentStep.type === 'combined')) {
                scene.updateMatrixWorld(true);
                let eePos = new THREE.Vector3();
                endEffector.getWorldPosition(eePos);
                const dist = eePos.distanceTo(currentStep.targets.position);
                
                if (dist > 0.8) {
                    isSuccess = false;
                    if(activeObstacleBoxes.length > 0) {
                        failReason = `End effector missed. Dist: ${dist.toFixed(2)}. Obstacles might be blocking the path!`;
                    } else {
                        failReason = `End effector is too far. Dist: ${dist.toFixed(2)} units.`;
                    }
                }
            }

            if (isSuccess) {
                if (currentStepIndex < currentChallenge.steps.length - 1) {
                    currentStepIndex++;
                    updateChallengeUI();
                    statusEl.innerHTML = "✅ Action Complete! Moving to next...";
                    statusEl.className = "text-center py-2.5 px-3 rounded-lg font-bold text-sm shadow-inner transition-all duration-300 bg-blue-600 text-white mt-2 block";
                } else {
                    completeCurrentChallenge();

                    statusEl.innerHTML = "✨ SUCCESS! Challenge Complete.";
                    statusEl.className = "text-center py-2.5 px-3 rounded-lg font-bold text-sm shadow-inner transition-all duration-300 bg-emerald-600 text-white mt-2 block";
                }
            } else {
                statusEl.innerHTML = `❌ FAILED: <span class="font-normal text-xs block mt-1">${failReason}</span>`;
                statusEl.className = "text-center py-2.5 px-3 rounded-lg font-bold text-sm shadow-inner transition-all duration-300 bg-red-900/80 border border-red-700 text-red-200 mt-2 block";
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        
        window.onload = function() {
            init();
            animate();
        };
    </script>
</body>
